services:
  - type: web
    runtime: static
    name: retoma-seguimiento
    buildCommand: echo "Sitio estático sin dependencias"
    staticPublishPath: public
    autoDeploy: false
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
